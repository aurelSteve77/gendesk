# GenDesk catalog.
#
# Static reference data: the set of instruments that can ever receive an entity
# token, together with the sector / asset-class attributes used by the constrained
# decoder and the risk model.
#
# Survivorship: this list is a fixed, point-in-time-agnostic snapshot of liquid US
# listings. Names that were acquired or delisted during the sample (and therefore
# return no history) are dropped by the loader rather than back-filled, which
# leaves a known upward bias in absolute returns. Every headline result in this
# repository is a *relative* comparison against baselines drawn from the same
# catalog, which is the standard mitigation when a survivorship-free universe is
# not available. See docs/limitations.md.

