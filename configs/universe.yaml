# Series used purely as conditioning signal. They never receive an entity token and
# can never be held, which keeps the tradable catalog and the context vocabulary
# strictly disjoint.
macro_series:
  - "^VIX"
  - "^TNX"
  - "^IRX"
  - "^GSPC"

# Benchmark used for beta, active return and the reward model's risk adjustment.
benchmark: SPY
