name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint + types + tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Create environment
        run: |
          uv venv --python ${{ matrix.python-version }} .venv
          VIRTUAL_ENV=.venv uv pip install torch --index-url https://download.pytorch.org/whl/cpu
          VIRTUAL_ENV=.venv uv pip install -e ".[dev]"

      - name: Ruff
        run: .venv/bin/ruff check src tests app

      - name: Ruff format check
        run: .venv/bin/ruff format --check src tests app

      - name: mypy
        run: .venv/bin/mypy

      - name: Tests (offline)
        run: .venv/bin/pytest -m "not network" --cov=src/gendesk --cov-report=term-missing
