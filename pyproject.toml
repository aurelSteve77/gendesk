[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gendesk"
version = "0.1.0"
description = "GenDesk - LLM-native generative construction of an institutional research desk page for financial markets"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Steve" }]
keywords = [
    "quantitative-finance",
    "generative-recommendation",
    "transformers",
    "reinforcement-learning",
    "portfolio-construction",
]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14.0",
    "scipy>=1.11",
    "torch>=2.2",
    "typer>=0.12",
    "rich>=13.7",
    "structlog>=24.1",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "tenacity>=8.2",
    "matplotlib>=3.8",
    "plotly>=5.20",
    "streamlit>=1.33",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.9",
    "pandas-stubs",
    "types-PyYAML",
    "pre-commit>=3.7",
]

[project.scripts]
gendesk = "gendesk.cli:app"

[project.urls]
Homepage = "https://github.com/aurelSteve77/gendesk"
Documentation = "https://github.com/aurelSteve77/gendesk/tree/main/docs"

[tool.hatch.build.targets.wheel]
packages = ["src/gendesk"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "ARG", "PTH", "RUF"]
ignore = ["E501", "N803", "N806", "N812", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["gendesk", "app"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "B018"]

[tool.mypy]
packages = ["gendesk"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_defs = false
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: marks tests as slow",
    "network: requires network access",
]

[tool.coverage.run]
source = ["src/gendesk"]
omit = ["*/__init__.py"]
